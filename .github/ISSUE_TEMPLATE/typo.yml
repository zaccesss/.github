name: Typo or small fix
description: Spotted a typo or a small wording slip
title: "docs: "
labels: [documentation]
assignees: [zaccesss]
body:
  - type: markdown
    attributes:
      value: |
        For a trivial typo you are welcome to skip this and open a pull request directly. Thank you either way.
  - type: textarea
    id: where
    attributes:
      label: Where is it
      description: The file, page or line, with what it should say.
    validations:
      required: true
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I have checked this is not already reported or fixed.
          required: true
        - label: I wrote this title and description myself, following the [AI policy](https://github.com/zaccesss/ai-policy).
          required: true
  - type: checkboxes
    id: help
    attributes:
      label: Willing to help?
      description: Optional. Typo fixes are very welcome as a quick pull request.
      options:
        - label: I would be happy to open a pull request for this myself.
