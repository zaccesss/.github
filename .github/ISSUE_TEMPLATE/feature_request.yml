name: Idea or improvement
description: Suggest a change or a new idea
title: "feat: "
labels: [enhancement]
assignees: [zaccesss]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Telling me the problem you want to solve helps more than the solution alone.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do? What gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How might it work? Rough thoughts are fine.
    validations:
      required: false
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I have searched for an existing issue that already suggests this.
          required: true
        - label: I have read the [contributing guide](https://github.com/zaccesss/contribute) and the [code of conduct](https://github.com/zaccesss/code-of-conduct).
          required: true
        - label: I wrote this title and description myself, following the [AI policy](https://github.com/zaccesss/ai-policy).
          required: true
